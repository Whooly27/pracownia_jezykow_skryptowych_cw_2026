# Reusable workflow: build an app's Docker image and, when requested, push it to GHCR.
# Called by each app's CI workflow so image conventions stay identical across the monorepo.
name: docker-image

on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/ (also used as the image name suffix)
        required: true
        type: string
      push:
        description: Push the image to GHCR
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.app }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.app }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

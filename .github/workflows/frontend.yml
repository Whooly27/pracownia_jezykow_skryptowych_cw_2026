name: frontend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/_docker-image.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/_docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/frontend

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test:ci
      - run: npm run build-only
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 7

  image:
    name: Docker image
    needs: [verify]
    uses: ./.github/workflows/_docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      app: frontend
      push: ${{ github.event_name != 'pull_request' }}

  deploy:
    name: Deploy to Vercel
    needs: [verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    defaults:
      run:
        working-directory: dist
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: dist
      # Same-origin `/api`, mirroring the nginx reverse proxy in the container image.
      - name: Write Vercel routing config
        run: |
          jq -n --arg backend "$BACKEND_URL" '{
            git: { deploymentEnabled: false },
            rewrites: [
              { source: "/api/(.*)", destination: "\($backend)/api/$1" },
              { source: "/(.*)", destination: "/index.html" }
            ]
          }' > vercel.json
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
      - name: Deploy
        run: npx --yes vercel@63.1.2 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$FRONTEND_URL/api/health/"
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}

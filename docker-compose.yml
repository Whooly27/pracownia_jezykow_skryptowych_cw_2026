# Full local stack: Postgres + Django API + React SPA (served by nginx).
#   docker compose up -d db        -> only the database, for native dev
#   docker compose up --build      -> everything, http://localhost:8080

name: psj

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psj}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./apps/backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-local-only}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-psj}
      GUNICORN_WORKERS: "2"
    # Migrating on boot is fine for local use; production runs migrations as a separate release step.
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./apps/frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  pgdata:

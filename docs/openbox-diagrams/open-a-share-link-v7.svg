<text x="46.0" y="844" font-size="12" font-weight="600" fill="#d97706">alt  <tspan font-weight="400" fill="#6b7280">[unknown, expired or deleted link]</tspan></text>
<rect x="30.0" y="20" width="110" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="85.0" y="45" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Owner</text>
<rect x="242.92000000000002" y="20" width="110" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="297.92" y="45" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Recipient</text>
<rect x="654.2" y="20" width="110" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="709.2" y="45" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">API</text>
<rect x="826.16" y="20" width="110" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="881.16" y="45" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Cognito</text>
<rect x="992.6800000000001" y="20" width="110" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="1047.68" y="45" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Postgres</text>
<line x1="85.0" y1="94" x2="705.2" y2="94" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="397.1" y="87" font-size="13" fill="#111827" text-anchor="middle">POST /files/{file id}/links {permissions, expires_at}</text>
<line x1="709.2" y1="174" x2="89.0" y2="174" stroke="#111827" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="397.1" y="167" font-size="13" fill="#111827" text-anchor="middle">403 forbidden</text>
<line x1="709.2" y1="240" x2="1043.68" y2="240" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="878.44" y="233" font-size="13" fill="#111827" text-anchor="middle">save the link, store a hash of its token</text>
<line x1="709.2" y1="286" x2="89.0" y2="286" stroke="#111827" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="397.1" y="279" font-size="13" fill="#111827" text-anchor="middle">201 link with url (shown once)</text>
<line x1="85.0" y1="332" x2="293.92" y2="332" stroke="#111827" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="191.46" y="325" font-size="13" fill="#111827" text-anchor="middle">owner sends the url</text>
<line x1="297.92" y1="378" x2="705.2" y2="378" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="503.56000000000006" y="371" font-size="13" fill="#111827" text-anchor="middle">opens /links/{token} → POST /links/redeem</text>
<line x1="709.2" y1="458" x2="301.92" y2="458" stroke="#111827" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="503.56000000000006" y="451" font-size="13" fill="#111827" text-anchor="middle">401 unauthenticated</text>
<line x1="297.92" y1="504" x2="705.2" y2="504" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="503.56000000000006" y="497" font-size="13" fill="#111827" text-anchor="middle">GET /auth/login?return_to=/links/{token}</text>
<line x1="709.2" y1="550" x2="301.92" y2="550" stroke="#111827" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="503.56000000000006" y="543" font-size="13" fill="#111827" text-anchor="middle">302 to Cognito</text>
<line x1="297.92" y1="596" x2="877.16" y2="596" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="589.54" y="589" font-size="13" fill="#111827" text-anchor="middle">sign in or create an account</text>
<line x1="881.16" y1="642" x2="713.2" y2="642" stroke="#111827" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="795.1800000000001" y="635" font-size="13" fill="#111827" text-anchor="middle">GET /auth/callback</text>
<line x1="709.2" y1="688" x2="301.92" y2="688" stroke="#111827" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="503.56000000000006" y="681" font-size="13" fill="#111827" text-anchor="middle">session cookie, 302 to /links/{token}</text>
<line x1="297.92" y1="734" x2="705.2" y2="734" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="503.56000000000006" y="727" font-size="13" fill="#111827" text-anchor="middle">POST /links/redeem {token}</text>
<line x1="709.2" y1="800" x2="1043.68" y2="800" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="878.44" y="793" font-size="13" fill="#111827" text-anchor="middle">find the link by its token hash</text>
<line x1="709.2" y1="880" x2="301.92" y2="880" stroke="#111827" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="503.56000000000006" y="873" font-size="13" fill="#111827" text-anchor="middle">404 not_found · 410 link_expired · 410 link_deleted</text>
<line x1="709.2" y1="946" x2="1043.68" y2="946" stroke="#111827" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="878.44" y="939" font-size="13" fill="#111827" text-anchor="middle">give the recipient the link's permissions</text>
<line x1="709.2" y1="992" x2="301.92" y2="992" stroke="#111827" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="503.56000000000006" y="985" font-size="13" fill="#111827" text-anchor="middle">200 file → app opens Shared with me</text>
</svg>
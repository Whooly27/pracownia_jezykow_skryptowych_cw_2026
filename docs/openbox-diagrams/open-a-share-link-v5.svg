<svg xmlns="http://www.w3.org/2000/svg" width="1249" height="1042" viewBox="0 0 1249 1042" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="36.0" y="122" width="1177.16" height="78" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="4"/>
<rect x="36.0" y="406" width="1177.16" height="354" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="4"/>
